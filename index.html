<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohammad Yasir Hussaini · Solar Portfolio</title>
<meta name="description" content="Interactive solar-system portfolio of Mohammad Yasir Hussaini.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02050c; --star:#eaf0ff; --muted:#8a98b8; --gold:#f0c45a; --cyan:#5ce1e6;
  --panel:rgba(8,12,28,.94); --line:rgba(255,255,255,.12);
  --fd:"Orbitron",system-ui,sans-serif; --fb:"Outfit",system-ui,sans-serif; --fm:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--star);font-family:var(--fb);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--cyan)}
#stars,#zoomfx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#stars{z-index:0}
#zoomfx{z-index:40;opacity:0}

.hud{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;
  padding:14px clamp(12px,3vw,28px);pointer-events:none}
.hud>*{pointer-events:auto}
.brand{font-family:var(--fd);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.brand span{color:var(--muted)}
.hint{font-family:var(--fm);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;max-width:50vw;text-align:right}
.crumbs{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:50;font-family:var(--fm);
  font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.crumbs.on{opacity:1}

/* SYSTEM */
#system-view{position:fixed;inset:0;z-index:1;display:grid;place-items:center;
  transition:opacity .55s,transform .75s cubic-bezier(.2,.7,.2,1),filter .55s}
#system-view.hide{opacity:0;transform:scale(1.25);filter:blur(14px);pointer-events:none}

.system{position:relative;width:min(96vw,800px);height:min(96vw,800px)}
.orbit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
  border:1px solid rgba(255,255,255,.055);pointer-events:none}
.o1{width:22%;height:22%}.o2{width:34%;height:34%}.o3{width:46%;height:46%}.o4{width:58%;height:58%}
.o5{width:70%;height:70%}.o6{width:82%;height:82%}.o7{width:92%;height:92%}.o8{width:100%;height:100%}

.sun-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;text-align:center}
.planet-btn{border-radius:50%;cursor:pointer;position:relative;transition:transform .3s,filter .3s;
  box-shadow:inset -8px -4px 16px rgba(0,0,0,.35)}
.planet-btn:hover,.planet-btn:focus-visible{transform:scale(1.12);filter:brightness(1.15)}
.planet-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}

/* Realistic planet surfaces via layered gradients */
.sun-btn{
  width:clamp(72px,12vw,104px);height:clamp(72px,12vw,104px);
  background:
    radial-gradient(circle at 32% 28%,#fffce8 0%,#ffe566 18%,#f0a820 42%,#d06010 70%,#702008 100%);
  box-shadow:0 0 40px 16px rgba(240,180,50,.55),0 0 90px 36px rgba(240,160,40,.25),
    inset -12px -8px 28px rgba(120,40,0,.4);
  animation:sunpulse 4s ease-in-out infinite;
}
@keyframes sunpulse{0%,100%{box-shadow:0 0 40px 16px rgba(240,180,50,.55),0 0 90px 36px rgba(240,160,40,.25)}
50%{box-shadow:0 0 52px 20px rgba(255,200,60,.65),0 0 110px 44px rgba(240,160,40,.32)}}
.sun-label{margin-top:10px;font-family:var(--fd);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

.pw{position:absolute;left:50%;top:50%;width:0;height:0;z-index:5}
.pw .planet-btn{position:absolute}
.pw .pl{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-family:var(--fd);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  pointer-events:none;transition:color .2s}
.pw:hover .pl,.pw:focus-within .pl{color:var(--star)}

/* Mercury — cratered gray-brown */
.p-mer .planet-btn{
  width:24px;height:24px;top:-12px;left:-12px;
  background:
    radial-gradient(circle at 70% 70%,transparent 40%,rgba(0,0,0,.25) 41%),
    radial-gradient(circle at 30% 25%,#e8dcc4,#a89878 45%,#6a5c48 80%,#3a3428);
  box-shadow:0 0 14px 3px rgba(160,140,110,.3),inset -4px -2px 8px rgba(0,0,0,.4);
}
/* Venus — thick yellow-white atmosphere */
.p-ven .planet-btn{
  width:36px;height:36px;top:-18px;left:-18px;
  background:
    radial-gradient(circle at 35% 30%,#fff5d0 0%,#f0d070 30%,#d4a040 60%,#a06820 100%);
  box-shadow:0 0 18px 5px rgba(220,180,80,.4),inset -6px -3px 12px rgba(80,40,0,.25);
}
/* Earth — blue oceans + green land suggestion */
.p-ear .planet-btn{
  width:38px;height:38px;top:-19px;left:-19px;
  background:
    radial-gradient(circle at 28% 32%,rgba(255,255,255,.35) 0%,transparent 18%),
    radial-gradient(ellipse 40% 30% at 55% 45%,#2d8a4a 0%,#2d8a4a 40%,transparent 41%),
    radial-gradient(ellipse 25% 35% at 30% 55%,#3a9a55 0%,transparent 50%),
    radial-gradient(circle at 40% 40%,#4aa0d8 0%,#1a5a98 55%,#0a3060 100%);
  box-shadow:0 0 20px 6px rgba(60,140,200,.45),inset -6px -3px 12px rgba(0,20,40,.4);
}
/* Mars — rusty red */
.p-mar .planet-btn{
  width:30px;height:30px;top:-15px;left:-15px;
  background:
    radial-gradient(circle at 65% 60%,rgba(0,0,0,.2) 0%,transparent 25%),
    radial-gradient(circle at 32% 28%,#ffb090,#d05030 50%,#802018 85%,#401008);
  box-shadow:0 0 16px 4px rgba(200,70,40,.4),inset -5px -2px 10px rgba(40,10,0,.4);
}
/* Jupiter — banded gas giant */
.p-jup .planet-btn{
  width:54px;height:54px;top:-27px;left:-27px;
  background:
    repeating-linear-gradient(180deg,
      #e8c890 0px,#e8c890 6px,#c89050 6px,#c89050 11px,
      #f0d8b0 11px,#f0d8b0 15px,#a86830 15px,#a86830 20px,
      #d4a870 20px,#d4a870 24px),
    radial-gradient(circle at 30% 30%,transparent 40%,rgba(0,0,0,.25));
  background-blend-mode:multiply,normal;
  box-shadow:0 0 24px 7px rgba(200,150,80,.4),inset -8px -4px 16px rgba(60,30,0,.35);
}
/* Saturn — pale gold + ring */
.p-sat .planet-btn{
  width:48px;height:48px;top:-24px;left:-24px;
  background:radial-gradient(circle at 32% 28%,#f5ecd0,#d4c890 50%,#9a8a50 90%);
  box-shadow:0 0 20px 5px rgba(200,180,120,.35),inset -6px -3px 12px rgba(40,30,10,.3);
}
.p-sat .ring{position:absolute;width:78px;height:20px;left:50%;top:50%;transform:translate(-50%,-50%);
  border:2.5px solid rgba(210,190,140,.5);border-radius:50%;pointer-events:none;
  box-shadow:0 0 8px rgba(200,180,120,.25)}
/* Uranus — ice cyan */
.p-ura .planet-btn{
  width:40px;height:40px;top:-20px;left:-20px;
  background:radial-gradient(circle at 30% 28%,#d0f4f8,#70c0d0 50%,#308090 90%);
  box-shadow:0 0 18px 5px rgba(100,200,210,.4),inset -6px -3px 12px rgba(0,40,50,.3);
}
/* Neptune — deep blue */
.p-nep .planet-btn{
  width:38px;height:38px;top:-19px;left:-19px;
  background:
    radial-gradient(circle at 60% 55%,rgba(100,140,255,.35) 0%,transparent 30%),
    radial-gradient(circle at 30% 28%,#90b0f8,#3050c0 55%,#182878 95%);
  box-shadow:0 0 18px 5px rgba(60,90,200,.45),inset -6px -3px 12px rgba(0,10,40,.4);
}

.p-mer .pl{top:15px}.p-ven .pl{top:21px}.p-ear .pl{top:23px}.p-mar .pl{top:19px}
.p-jup .pl{top:32px}.p-sat .pl{top:30px}.p-ura .pl{top:24px}.p-nep .pl{top:23px}

.p-mer{animation:orb1 18s linear infinite}
.p-ven{animation:orb2 28s linear infinite}
.p-ear{animation:orb3 36s linear infinite}
.p-mar{animation:orb4 48s linear infinite}
.p-jup{animation:orb5 72s linear infinite}
.p-sat{animation:orb6 90s linear infinite}
.p-ura{animation:orb7 110s linear infinite}
.p-nep{animation:orb8 130s linear infinite}
@keyframes orb1{from{transform:rotate(0deg) translateX(min(11vw,88px)) rotate(0)}to{transform:rotate(360deg) translateX(min(11vw,88px)) rotate(-360deg)}}
@keyframes orb2{from{transform:rotate(40deg) translateX(min(17vw,136px)) rotate(-40deg)}to{transform:rotate(400deg) translateX(min(17vw,136px)) rotate(-400deg)}}
@keyframes orb3{from{transform:rotate(100deg) translateX(min(23vw,184px)) rotate(-100deg)}to{transform:rotate(460deg) translateX(min(23vw,184px)) rotate(-460deg)}}
@keyframes orb4{from{transform:rotate(180deg) translateX(min(29vw,232px)) rotate(-180deg)}to{transform:rotate(540deg) translateX(min(29vw,232px)) rotate(-540deg)}}
@keyframes orb5{from{transform:rotate(250deg) translateX(min(35vw,280px)) rotate(-250deg)}to{transform:rotate(610deg) translateX(min(35vw,280px)) rotate(-610deg)}}
@keyframes orb6{from{transform:rotate(310deg) translateX(min(41vw,328px)) rotate(-310deg)}to{transform:rotate(670deg) translateX(min(41vw,328px)) rotate(-670deg)}}
@keyframes orb7{from{transform:rotate(20deg) translateX(min(46vw,368px)) rotate(-20deg)}to{transform:rotate(380deg) translateX(min(46vw,368px)) rotate(-380deg)}}
@keyframes orb8{from{transform:rotate(70deg) translateX(min(50vw,400px)) rotate(-70deg)}to{transform:rotate(430deg) translateX(min(50vw,400px)) rotate(-430deg)}}
.system:hover .pw{animation-play-state:paused}

.intro{position:absolute;left:50%;bottom:-5%;transform:translateX(-50%);text-align:center;width:min(92vw,520px);z-index:7;pointer-events:none}
.intro h1{font-family:var(--fd);font-size:clamp(15px,3vw,22px);letter-spacing:.1em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--gold),#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.intro p{font-size:13.5px;color:var(--muted);line-height:1.5}

/* INTERIOR */
#interior{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;
  background:#02050c}
#interior.open{display:flex}
.int-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px clamp(12px,3vw,28px);border-bottom:1px solid var(--line);background:rgba(0,0,0,.4);z-index:2}
.int-title{font-family:var(--fd);font-size:clamp(13px,2.4vw,17px);letter-spacing:.08em;text-transform:uppercase}
.int-title span{color:var(--muted);font-weight:500}
.btn-back{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted);
  transition:color .2s,border-color .2s,background .2s}
.btn-back:hover,.btn-back:focus-visible{color:var(--star);border-color:var(--cyan);background:rgba(92,225,230,.08);outline:none}

.int-body{flex:1;overflow:auto;display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:860px){.int-body{grid-template-columns:1.15fr .85fr}}

.map-stage{position:relative;min-height:min(52vh,480px);display:grid;place-items:center;padding:20px;
  background:radial-gradient(ellipse at 50% 40%,rgba(40,60,120,.2),transparent 60%)}
.detail-pane{padding:clamp(18px,3vw,28px);border-top:1px solid var(--line);background:var(--panel);
  overflow:auto;min-height:220px}
@media(min-width:860px){
  .detail-pane{border-top:0;border-left:1px solid var(--line)}
  .map-stage{min-height:100%}
}

/* Planet surface globe (large) */
.surface{
  position:relative;width:min(92%,380px);aspect-ratio:1;border-radius:50%;
  overflow:hidden;
  box-shadow:inset -24px -12px 48px rgba(0,0,0,.45),0 0 50px rgba(80,120,200,.12);
}
.surface.earth-s{
  background:
    radial-gradient(circle at 28% 30%,rgba(255,255,255,.25) 0%,transparent 20%),
    radial-gradient(circle at 50% 50%,#1a6aaa 0%,#0d4a7a 60%,#062840 100%);
}
.surface.sun-s{background:radial-gradient(circle at 35% 30%,#fff8d0,#f0a820 40%,#a04010)}
.surface.mer-s{background:radial-gradient(circle at 35% 30%,#d8c8a8,#8a7a60 50%,#4a4030)}
.surface.ven-s{background:radial-gradient(circle at 35% 30%,#fff0c0,#e0a840 50%,#905820)}
.surface.mar-s{background:radial-gradient(circle at 35% 30%,#ffb090,#c04028 50%,#601810)}
.surface.jup-s{
  background:repeating-linear-gradient(180deg,#e8c890 0%,#e8c890 8%,#c89050 8%,#c89050 14%,#f0d8b0 14%,#f0d8b0 20%,#a86830 20%,#a86830 26%,#d4a870 26%,#d4a870 32%);
}
.surface.sat-s{background:radial-gradient(circle at 35% 30%,#f5ecd0,#c8b870 55%,#807840)}
.surface.ura-s{background:radial-gradient(circle at 35% 30%,#d0f4f8,#60b0c0 55%,#287080)}
.surface.nep-s{background:radial-gradient(circle at 35% 30%,#90b0f8,#3048b8 55%,#182070)}

/* Cloud layer for Earth zoom */
.clouds{position:absolute;inset:-5%;border-radius:50%;pointer-events:none;
  background:
    radial-gradient(ellipse 30% 18% at 25% 30%,rgba(255,255,255,.45),transparent),
    radial-gradient(ellipse 40% 20% at 70% 45%,rgba(255,255,255,.35),transparent),
    radial-gradient(ellipse 25% 15% at 40% 70%,rgba(255,255,255,.3),transparent);
  animation:drift 28s linear infinite;opacity:.85}
@keyframes drift{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* Continent SVGs on Earth */
.continents{position:absolute;inset:0;width:100%;height:100%}
.continents path,.region-shape{
  cursor:pointer;transition:fill .25s,filter .25s,stroke .25s;
  stroke:rgba(255,255,255,.15);stroke-width:.4;
}
.continents path{fill:#2d8a4e}
.continents path:hover,.continents path.active,
.region-shape:hover,.region-shape.active{
  fill:#4eca6e;filter:drop-shadow(0 0 8px rgba(100,220,140,.5));stroke:rgba(255,255,255,.4)
}
.region-shape{position:absolute;border-radius:40% 60% 50% 45%;cursor:pointer;
  border:1px solid rgba(255,255,255,.12);transition:transform .2s,filter .2s,background .2s,border-color .2s}
.region-shape:hover,.region-shape.active{
  transform:scale(1.06);filter:brightness(1.25);border-color:rgba(255,255,255,.4);
  box-shadow:0 0 16px rgba(255,255,255,.2)
}
.region-label{position:absolute;font-family:var(--fd);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap;
  transform:translate(-50%,-50%);z-index:3}

/* Detail content */
.kicker{font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.detail-pane h2{font-family:var(--fd);font-size:clamp(18px,3vw,26px);letter-spacing:.04em;margin-bottom:14px;line-height:1.2}
.body-text{font-size:15px;color:#b4c0d8;line-height:1.6;margin-bottom:16px;max-width:58ch}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:16px 0}
.stat{text-align:center;padding:14px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.stat .n{font-family:var(--fd);font-size:clamp(22px,4vw,32px);font-weight:700;
  background:linear-gradient(135deg,var(--gold),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
.card{padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);margin-bottom:10px}
.card h3{font-size:16px;margin-bottom:4px}
.card .org{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.card p{font-size:14px;color:#b4c0d8;line-height:1.5}
.tag{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
.profile{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:18px}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:center 24%;
  border:2px solid rgba(240,196,90,.55);box-shadow:0 0 24px rgba(240,196,90,.3)}
.list{list-style:none}
.list li{display:flex;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);margin-bottom:8px}
.list .b{flex:none;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:6px;box-shadow:0 0 8px var(--gold)}
.list strong{display:block;font-size:14.5px;margin-bottom:2px}
.list span{font-size:13px;color:var(--muted)}
.quote{font-family:var(--fd);font-size:clamp(18px,3vw,24px);line-height:1.35;padding-left:14px;
  border-left:3px solid var(--gold);margin:12px 0 18px}
.cta{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;margin-top:12px;
  background:linear-gradient(135deg,var(--gold),#e08020);color:#1a1000;font-weight:600;text-decoration:none;
  box-shadow:0 8px 24px rgba(240,196,90,.3);transition:transform .2s}
.cta:hover{transform:translateY(-2px)}
.empty-hint{color:var(--muted);font-size:14px;text-align:center;padding:48px 20px}

@media(max-width:640px){
  .system{width:min(98vw,400px);height:min(98vw,400px)}
  .intro{bottom:-9%}
  .intro h1{font-size:13px}
  .sun-btn{width:58px;height:58px}
  .p-jup .planet-btn{width:38px;height:38px;top:-19px;left:-19px}
  .p-sat .planet-btn{width:34px;height:34px;top:-17px;left:-17px}
  .p-sat .ring{width:54px;height:14px}
  .pw .pl{font-size:7px}
  @keyframes orb1{from{transform:rotate(0deg) translateX(min(11vw,44px)) rotate(0)}to{transform:rotate(360deg) translateX(min(11vw,44px)) rotate(-360deg)}}
  @keyframes orb2{from{transform:rotate(40deg) translateX(min(17vw,68px)) rotate(-40deg)}to{transform:rotate(400deg) translateX(min(17vw,68px)) rotate(-400deg)}}
  @keyframes orb3{from{transform:rotate(100deg) translateX(min(23vw,92px)) rotate(-100deg)}to{transform:rotate(460deg) translateX(min(23vw,92px)) rotate(-460deg)}}
  @keyframes orb4{from{transform:rotate(180deg) translateX(min(29vw,116px)) rotate(-180deg)}to{transform:rotate(540deg) translateX(min(29vw,116px)) rotate(-540deg)}}
  @keyframes orb5{from{transform:rotate(250deg) translateX(min(35vw,140px)) rotate(-250deg)}to{transform:rotate(610deg) translateX(min(35vw,140px)) rotate(-610deg)}}
  @keyframes orb6{from{transform:rotate(310deg) translateX(min(41vw,164px)) rotate(-310deg)}to{transform:rotate(670deg) translateX(min(41vw,164px)) rotate(-670deg)}}
  @keyframes orb7{from{transform:rotate(20deg) translateX(min(46vw,184px)) rotate(-20deg)}to{transform:rotate(380deg) translateX(min(46vw,184px)) rotate(-380deg)}}
  @keyframes orb8{from{transform:rotate(70deg) translateX(min(50vw,200px)) rotate(-70deg)}to{transform:rotate(430deg) translateX(min(50vw,200px)) rotate(-430deg)}}
}
@media(prefers-reduced-motion:reduce){
  .pw,.sun-btn,.clouds{animation:none!important}
  #system-view{transition:none!important}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="zoomfx"></canvas>

<header class="hud">
  <div class="brand">Yasir <span>· Solar Portfolio</span></div>
  <div class="hint" id="hint">Select a planet · zoom into its surface</div>
</header>
<div class="crumbs" id="crumbs"></div>

<div id="system-view">
  <div class="system">
    <div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="orbit o4"></div>
    <div class="orbit o5"></div><div class="orbit o6"></div><div class="orbit o7"></div><div class="orbit o8"></div>

    <div class="sun-wrap">
      <button type="button" class="planet-btn sun-btn" data-world="sun" aria-label="Zoom into the Sun"></button>
      <div class="sun-label">Sun</div>
    </div>

    <div class="pw p-mer"><button type="button" class="planet-btn" data-world="mercury" aria-label="Zoom into Mercury"></button><span class="pl">Mercury</span></div>
    <div class="pw p-ven"><button type="button" class="planet-btn" data-world="venus" aria-label="Zoom into Venus"></button><span class="pl">Venus</span></div>
    <div class="pw p-ear"><button type="button" class="planet-btn" data-world="earth" aria-label="Zoom into Earth"></button><span class="pl">Earth</span></div>

/* stars */
const sc=document.getElementById("stars"), sx=sc.getContext("2d");
let W,H,stars=[],dpr=1;
function rs(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;sc.width=W*dpr;sc.height=H*dpr;sc.style.width=W+"px";sc.style.height=H+"px";sx.setTransform(dpr,0,0,dpr,0,0);
stars=Array.from({length:Math.floor(W*H/4200)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,a:Math.random()*.7+.2,tw:Math.random()*6.28,sp:.4+Math.random()}))}
function ds(t){sx.clearRect(0,0,W,H);
const g=sx.createRadialGradient(W*.7,H*.25,0,W*.7,H*.25,W*.5);g.addColorStop(0,"rgba(40,55,130,.12)");g.addColorStop(1,"transparent");sx.fillStyle=g;sx.fillRect(0,0,W,H);
for(const s of stars){const tw=.55+.45*Math.sin(t*.001*s.sp+s.tw);sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.28);sx.fillStyle="rgba(234,240,255,"+(s.a*tw)+")";sx.fill()}}
let lt=0;function loop(ts){if(!reduce&&ts-lt>33){lt=ts;ds(ts)}requestAnimationFrame(loop)}
rs();ds(0);addEventListener("resize",()=>{rs();ds(performance.now())});if(!reduce)requestAnimationFrame(loop);

/* zoom / cloud dive effect */
const zc=document.getElementById("zoomfx"), zx=zc.getContext("2d");
function rz(){zc.width=innerWidth*dpr;zc.height=innerHeight*dpr;zc.style.width=innerWidth+"px";zc.style.height=innerHeight+"px";zx.setTransform(dpr,0,0,dpr,0,0)}
rz();addEventListener("resize",rz);
function zoomIn(kind){return new Promise(res=>{
  zc.style.opacity="1";
  const t0=performance.now(),dur=reduce?0:900;
  function frame(t){
    const p=Math.min(1,(t-t0)/Math.max(dur,1));
    const e=p*p;
    zx.clearRect(0,0,innerWidth,innerHeight);
    // vignette + scale feel
    const cx=innerWidth/2,cy=innerHeight/2,R=Math.hypot(cx,cy)*(1.2-e*.9);
    const grad=zx.createRadialGradient(cx,cy,R*.15,cx,cy,R);
    if(kind==="earth"){
      grad.addColorStop(0,"rgba(180,210,240,"+(0.15+e*.5)+")");
      grad.addColorStop(.45,"rgba(40,80,140,"+(0.2+e*.4)+")");
      grad.addColorStop(1,"rgba(2,5,12,"+(0.3+e*.7)+")");
      // cloud streaks
      for(let i=0;i<12;i++){
        const a=(i/12)*Math.PI*2+p;
        zx.fillStyle="rgba(255,255,255,"+(0.08*(1-p))+")";
        zx.beginPath();
        zx.ellipse(cx+Math.cos(a)*R*.3,cy+Math.sin(a)*R*.2,80*(1-p*.5),18,a,0,6.28);
        zx.fill();
      }
    } else if(kind==="sun"){
      grad.addColorStop(0,"rgba(255,220,100,"+(0.3+e*.5)+")");
      grad.addColorStop(.5,"rgba(220,100,20,"+(0.25+e*.4)+")");
      grad.addColorStop(1,"rgba(2,5,12,"+(0.4+e*.6)+")");
    } else {
      grad.addColorStop(0,"rgba(60,90,160,"+(0.15+e*.35)+")");
      grad.addColorStop(1,"rgba(2,5,12,"+(0.35+e*.65)+")");
    }
    zx.fillStyle=grad;zx.fillRect(0,0,innerWidth,innerHeight);
    if(p<1)requestAnimationFrame(frame);else{zc.style.opacity="0";zx.clearRect(0,0,innerWidth,innerHeight);res()}
  }
  if(reduce){zc.style.opacity="0";res()}else requestAnimationFrame(frame);
})}

const systemView=document.getElementById("system-view");
const interior=document.getElementById("interior");
const intBody=document.getElementById("int-body");
const intTitle=document.getElementById("int-title");
const hint=document.getElementById("hint");
const crumbs=document.getElementById("crumbs");

async function approach(id){
  const w=WORLDS[id]; if(!w) return;
  hint.textContent="Entering "+w.name+"…";
  document.querySelectorAll("[data-world]").forEach(b=>b.disabled=true);
  await zoomIn(id==="earth"?"earth":id==="sun"?"sun":"other");
  openInterior(id);
  document.querySelectorAll("[data-world]").forEach(b=>b.disabled=false);
}

function openInterior(id){
  const w=WORLDS[id]; if(!w) return;
  systemView.classList.add("hide");
  interior.classList.add("open");
  intTitle.innerHTML=w.name+' <span>· '+w.role+'</span>';
  crumbs.textContent="System  →  "+w.name; crumbs.classList.add("on");
  hint.textContent="Select a land on "+w.name;

  let mapHtml="";
  if(w.layout==="earth"){
    mapHtml=`<div class="surface earth-s">${w.clouds?'<div class="clouds"></div>':''}${EARTH_SVG}
      <span class="region-label" style="left:50%;top:52%">Africa</span>
      <span class="region-label" style="left:52%;top:30%">Europe</span>
      <span class="region-label" style="left:72%;top:38%">Asia</span>
      <span class="region-label" style="left:26%;top:36%">N. America</span>
      <span class="region-label" style="left:32%;top:64%">S. America</span>
      <span class="region-label" style="left:84%;top:66%">Oceania</span>
    </div>`;
  } else {
    const pos=BLOB_POS[id]||[];
    const blobs=w.regions.map((r,i)=>{
      const p=pos[i]||{x:40+i*10,y:40,w:24,h:20,c:"rgba(120,160,200,.5)"};
      return `<button type="button" class="region-shape" data-region="${r.id}" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%;background:${p.c}" aria-label="${r.label}"></button>
        <span class="region-label" style="left:${p.x+p.w/2}%;top:${p.y+p.h/2}%">${r.label}</span>`;
    }).join("");
    mapHtml=`<div class="surface ${w.surface}">${blobs}</div>`;
  }

  intBody.innerHTML=`
    <div class="map-stage">${mapHtml}</div>
    <div class="detail-pane" id="detail"><p class="empty-hint">Select a land on the surface to open its records.</p></div>`;

  intBody.querySelectorAll("[data-region]").forEach(el=>{
    el.addEventListener("click",()=>selectRegion(id, el.getAttribute("data-region"), el));
  });
  // auto first
  const first=w.regions[0];
  if(first){
    const el=intBody.querySelector('[data-region="'+first.id+'"]');
    selectRegion(id, first.id, el);
  }
}

function selectRegion(worldId, regionId, el){
  const w=WORLDS[worldId]; const r=w.regions.find(x=>x.id===regionId); if(!r) return;
  intBody.querySelectorAll("[data-region]").forEach(b=>b.classList.remove("active"));
  if(el) el.classList.add("active");
  crumbs.textContent="System  →  "+w.name+"  →  "+r.label;
  const pane=document.getElementById("detail");
  pane.innerHTML=`<div class="kicker">${w.name} · ${r.label}</div><h2>${r.title}</h2>${r.html}`;
  hint.textContent=r.title;
}

function returnSystem(){
  interior.classList.remove("open");
  systemView.classList.remove("hide");
  crumbs.classList.remove("on"); crumbs.textContent="";
  hint.textContent="Select a planet · zoom into its surface";
}

document.querySelectorAll("[data-world]").forEach(el=>{
  el.addEventListener("click",()=>approach(el.dataset.world));
});
document.getElementById("btn-system").addEventListener("click", returnSystem);
addEventListener("keydown",e=>{ if(e.key==="Escape"&&interior.classList.contains("open")) returnSystem(); });
})();
